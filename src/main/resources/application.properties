spring.application.name=ecommerce-products
# ===== DATASOURCE CONFIGURATION =====
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE CONFIGURATION =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# NO es necesario especificar dialecto - Hibernate lo detecta automáticamente
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== CONNECTION POOL =====
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10